<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carolina Crosshairs</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:Arial, Helvetica, sans-serif;

            background:
                linear-gradient(
                    rgba(11,15,26,0.88),
                    rgba(17,24,39,0.92)
                ),
                url('https://images.unsplash.com/photo-1500674425229-f692875b0ab7?q=80&w=2070&auto=format&fit=crop');

            background-size:cover;
            background-position:center;
            background-repeat:no-repeat;

            color:white;

            min-height:100vh;

            display:flex;
            justify-content:center;
            align-items:center;

            padding:20px;

            overflow-x:hidden;

            position:relative;
        }

        body::before{
            content:"";

            position:fixed;

            top:0;
            left:0;

            width:100%;
            height:100%;

            background:
                radial-gradient(
                    rgba(0,191,255,0.15),
                    transparent 70%
                );

            animation:lightningFlash 6s infinite;

            pointer-events:none;
        }

        @keyframes lightningFlash{

            0%{
                opacity:0;
            }

            2%{
                opacity:1;
            }

            4%{
                opacity:0.2;
            }

            6%{
                opacity:0.9;
            }

            8%{
                opacity:0;
            }

            100%{
                opacity:0;
            }
        }

        .container{
            width:100%;
            max-width:450px;

            background:rgba(255,255,255,0.05);

            border:1px solid rgba(255,255,255,0.08);

            border-radius:22px;

            padding:35px 25px;

            text-align:center;

            backdrop-filter:blur(12px);

            box-shadow:
                0 0 35px rgba(0,0,0,0.5);

            position:relative;

            z-index:2;
        }

        .profile-pic{
            width:200px;
            height:200px;

            object-fit:cover;

            border-radius:50%;

            border:4px solid #00bfff;

            margin:0 auto 22px auto;

            display:block;

            box-shadow:
                0 0 35px rgba(0,191,255,0.65);
        }

        h1{
            font-size:34px;

            margin-bottom:14px;

            letter-spacing:1px;
        }

        .tagline{
            color:#cbd5e1;

            font-size:16px;

            line-height:1.7;

            margin-bottom:28px;
        }

        .topics{
            margin-bottom:28px;
        }

        .topic{
            display:inline-block;

            background:#1e293b;

            border:1px solid #334155;

            padding:10px 15px;

            border-radius:30px;

            margin:6px;

            font-size:14px;

            color:#e2e8f0;
        }

        .link-btn{
            display:block;

            width:100%;

            padding:16px;

            margin:14px 0;

            border-radius:14px;

            text-decoration:none;

            color:white;

            font-size:18px;

            font-weight:bold;

            transition:0.3s ease;
        }

        .twitter{
            background:#1DA1F2;
        }

        .discord{
            background:#5865F2;
        }

        .link-btn:hover{
            transform:scale(1.04);
            opacity:0.92;
        }

        .bottom-banner{
            width:100%;

            margin-top:28px;

            border-radius:16px;

            border:2px solid rgba(255,255,255,0.1);

            box-shadow:
                0 0 25px rgba(0,0,0,0.45);
        }

        .footer{
            margin-top:24px;

            font-size:13px;

            color:#94a3b8;
        }

    </style>
</head>

<body>

    <div class="container">

        <img
            src="./logo.jpg"
            alt="Carolina Crosshairs Logo"
            class="profile-pic"
        >

        <h1>Carolina Crosshairs</h1>

        <p class="tagline">
            Daily Posts on X<br>
            Discussion & Bet Props in Discord
        </p>

        <div class="topics">

            <span class="topic">Charlotte Hornets</span>
            <span class="topic">Carolina Panthers</span>
            <span class="topic">Carolina Hurricanes</span>
            <span class="topic">NASCAR</span>

        </div>

        <a
            href="https://x.com/nccrosshairs?s=21&t=eKC4xWjZ_6Gho3PfQ4EITw"
            class="link-btn twitter"
            target="_blank"
        >
            Follow on X
        </a>

        <a
            href="https://discord.gg/RkWfmrhzq"
            class="link-btn discord"
            target="_blank"
        >
            Join The Discord
        </a>

        <img
            src="./CCH HQ BANNER.jpg"
            alt="Carolina Sports Banner"
            class="bottom-banner"
        >

        <div class="footer">
            © 2026 Carolina Crosshairs
        </div>

    </div>

</body>
</html>
