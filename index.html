<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Carolina Crosshairs</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{

            font-family:Arial, Helvetica, sans-serif;

            background:
                linear-gradient(
                    rgba(11,15,26,0.88),
                    rgba(17,24,39,0.92)
                ),
                url('https://images.unsplash.com/photo-1500674425229-f692875b0ab7?q=80&w=2070&auto=format&fit=crop');

            background-size:cover;
            background-position:center;
            background-repeat:no-repeat;

            color:white;

            min-height:100vh;

            display:flex;
            justify-content:center;
            align-items:center;

            padding:20px;

            overflow-x:hidden;

            position:relative;
        }

        /* RED PULSING EFFECT */

        body::before{

            content:"";

            position:fixed;

            top:0;
            left:0;

            width:100%;
            height:100%;

            background:
                radial-gradient(
                    rgba(255,0,0,0.22),
                    transparent 70%
                );

            animation:redPulse 1.5s infinite;

            pointer-events:none;
        }

        @keyframes redPulse{

            0%{
                opacity:0;
            }

            8%{
                opacity:1;
            }

            16%{
                opacity:0.15;
            }

            24%{
                opacity:0.95;
            }

            32%{
                opacity:0.2;
            }

            40%{
                opacity:1;
            }

            48%{
                opacity:0;
            }

            100%{
                opacity:0;
            }
        }

        /* CONTAINER */

        .container{

            width:100%;
            max-width:450px;

            background:rgba(255,255,255,0.05);

            border:1px solid rgba(255,255,255,0.08);

            border-radius:24px;

            padding:38px 26px;

            text-align:center;

            backdrop-filter:blur(14px);

            box-shadow:
                0 0 40px rgba(0,0,0,0.55);

            position:relative;

            z-index:2;
        }

        /* LOGO WRAPPER */

        .logo-wrapper{

            position:relative;

            width:220px;
            height:220px;

            margin:0 auto 24px auto;

            display:flex;
            align-items:center;
            justify-content:center;
        }

        /* MAIN LOGO */

        .profile-pic{

            width:200px;
            height:200px;

            object-fit:cover;

            border-radius:50%;

            border:4px solid #00bfff;

            position:relative;

            z-index:5;

            box-shadow:
                0 0 18px rgba(0,191,255,0.8),
                0 0 40px rgba(255,0,0,0.45);

            animation:
                logoPulse 1.4s infinite ease-in-out;
        }

        /* ELECTRIC SIZZLE RING */

        .logo-wrapper::before{

            content:"";

            position:absolute;

            width:215px;
            height:215px;

            border-radius:50%;

            border-top:3px solid rgba(255,0,0,0.95);
            border-right:3px solid rgba(0,191,255,0.9);
            border-bottom:3px solid rgba(168,85,247,0.9);
            border-left:3px solid rgba(255,0,0,0.95);

            filter:blur(0.4px);

            box-shadow:
                0 0 12px rgba(255,0,0,0.85),
                0 0 28px rgba(0,191,255,0.55),
                0 0 40px rgba(168,85,247,0.4);

            animation:
                electricSpin 1.4s linear infinite,
                electricFlicker 0.12s infinite;
        }

        /* SECONDARY OUTER RING */

        .logo-wrapper::after{

            content:"";

            position:absolute;

            width:235px;
            height:235px;

            border-radius:50%;

            border-left:2px solid rgba(255,0,0,0.8);
            border-top:2px solid rgba(168,85,247,0.8);

            opacity:0.85;

            animation:
                reverseSpin 2s linear infinite,
                electricFlicker 0.2s infinite;
        }

        /* TITLE */

        h1{

            font-size:34px;

            margin-bottom:14px;

            letter-spacing:1px;

            text-shadow:
                0 0 12px rgba(255,0,0,0.45);
        }

        /* TAGLINE */

        .tagline{

            color:#cbd5e1;

            font-size:16px;

            line-height:1.7;

            margin-bottom:28px;
        }

        /* TOPICS */

        .topics{
            margin-bottom:28px;
        }

        .topic{

            display:inline-block;

            background:#1e293b;

            border:1px solid #334155;

            padding:10px 15px;

            border-radius:30px;

            margin:6px;

            font-size:14px;

            color:#e2e8f0;

            transition:0.3s ease;
        }

        .topic:hover{

            transform:translateY(-3px);

            box-shadow:
                0 0 15px rgba(255,0,0,0.45);
        }

        /* BUTTONS */

        .link-btn{

            display:block;

            width:100%;

            padding:16px;

            margin:14px 0;

            border-radius:14px;

            text-decoration:none;

            color:white;

            font-size:18px;

            font-weight:bold;

            transition:0.3s ease;

            position:relative;

            overflow:hidden;
        }

        .twitter{
            background:#1DA1F2;
        }

        .discord{
            background:#5865F2;
        }

        .link-btn:hover{

            transform:scale(1.04);

            opacity:0.94;

            box-shadow:
                0 0 22px rgba(255,0,0,0.55);
        }

        /* BOTTOM BANNER */

        .bottom-banner{

            width:100%;

            margin-top:30px;

            border-radius:16px;

            border:2px solid rgba(255,255,255,0.1);

            box-shadow:
                0 0 25px rgba(0,0,0,0.45);
        }

        /* SECOND FOOTER LOGO */

        .second-footer-logo{

            width:100%;

            max-width:260px;

            margin:24px auto 0 auto;

            display:block;

            object-fit:contain;

            opacity:0.95;

            background:none;
        }

        /* FOOTER */

        .footer{

            margin-top:24px;

            font-size:13px;

            color:#94a3b8;
        }

        /* ANIMATIONS */

        @keyframes electricSpin{

            from{
                transform:rotate(0deg);
            }

            to{
                transform:rotate(360deg);
            }
        }

        @keyframes reverseSpin{

            from{
                transform:rotate(360deg);
            }

            to{
                transform:rotate(0deg);
            }
        }

        @keyframes electricFlicker{

            0%{
                opacity:1;
            }

            20%{
                opacity:0.3;
            }

            40%{
                opacity:1;
            }

            60%{
                opacity:0.45;
            }

            80%{
                opacity:1;
            }

            100%{
                opacity:0.7;
            }
        }

        @keyframes logoPulse{

            0%{
                transform:scale(1);
            }

            50%{
                transform:scale(1.03);
            }

            100%{
                transform:scale(1);
            }
        }

    </style>

</head>

<body>

    <div class="container">

        <!-- LOGO -->

        <div class="logo-wrapper">

            <img
                src="./logo.jpg"
                alt="Carolina Crosshairs Logo"
                class="profile-pic"
            >

        </div>

        <!-- TITLE -->

        <h1>Carolina Crosshairs</h1>

        <!-- DESCRIPTION -->

        <p class="tagline">
            Daily Posts on X<br>
            Discussion & Bet Props in Discord
        </p>

        <!-- TOPICS -->

        <div class="topics">

            <span class="topic">Charlotte Hornets</span>
            <span class="topic">Carolina Panthers</span>
            <span class="topic">Carolina Hurricanes</span>
            <span class="topic">NASCAR</span>

        </div>

        <!-- SOCIAL BUTTONS -->

        <a
            href="https://x.com/nccrosshairs?s=21&t=eKC4xWjZ_6Gho3PfQ4EITw"
            class="link-btn twitter"
            target="_blank"
        >
            Follow on X
        </a>

        <a
            href="https://discord.gg/RkWfmrhzq"
            class="link-btn discord"
            target="_blank"
        >
            Join The Discord
        </a>

        <!-- MAIN BANNER -->

        <img
            src="./CCH HQ BANNER.jpg"
            alt="Carolina Sports Banner"
            class="bottom-banner"
        >

        <!-- SECOND FOOTER LOGO -->

        <img
            src="./America250_logo.svg.png"
            alt="America 250 Logo"
            class="second-footer-logo"
        >

        <!-- FOOTER -->

        <div class="footer">
            © 2026 Carolina Crosshairs
        </div>

    </div>

</body>
</html>
