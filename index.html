<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Carolina Crosshairs</title>

    <!-- FONT AWESOME ICONS -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    >

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{

            font-family:Arial, Helvetica, sans-serif;

            background:
                linear-gradient(
                    rgba(6,10,20,0.45),
                    rgba(10,15,30,0.65)
                ),
                url('./CCH HQ BANNER.jpg');

            background-size:cover;

            background-position:center;

            background-repeat:no-repeat;

            background-attachment:fixed;

            color:white;

            min-height:100vh;

            display:flex;

            justify-content:center;

            align-items:center;

            padding:20px;

            overflow-x:hidden;

            position:relative;
        }

        /* DARK OVERLAY */

        body::after{

            content:"";

            position:fixed;

            inset:0;

            background:
                rgba(0,0,0,0.38);

            z-index:0;

            pointer-events:none;
        }

        /* RED PULSE EFFECT */

        body::before{

            content:"";

            position:fixed;

            top:0;
            left:0;

            width:100%;
            height:100%;

            background:
                radial-gradient(
                    rgba(255,0,0,0.24),
                    transparent 70%
                );

            animation:redPulse 1.4s infinite;

            pointer-events:none;

            z-index:1;
        }

        @keyframes redPulse{

            0%{
                opacity:0;
            }

            8%{
                opacity:1;
            }

            16%{
                opacity:0.2;
            }

            24%{
                opacity:1;
            }

            32%{
                opacity:0.3;
            }

            40%{
                opacity:1;
            }

            48%{
                opacity:0;
            }

            100%{
                opacity:0;
            }
        }

        /* MAIN CONTAINER */

        .container{

            width:100%;

            max-width:460px;

            background:
                rgba(255,255,255,0.07);

            border:
                1px solid rgba(255,255,255,0.1);

            border-radius:28px;

            padding:40px 28px;

            text-align:center;

            backdrop-filter:blur(10px);

            box-shadow:
                0 0 40px rgba(0,0,0,0.6);

            position:relative;

            z-index:5;
        }

        /* LOGO WRAPPER */

        .logo-wrapper{

            position:relative;

            width:220px;
            height:220px;

            margin:0 auto 26px auto;

            display:flex;
            align-items:center;
            justify-content:center;
        }

        /* MAIN LOGO */

        .profile-pic{

            width:200px;
            height:200px;

            object-fit:cover;

            border-radius:50%;

            border:4px solid #00bfff;

            position:relative;

            z-index:5;

            box-shadow:
                0 0 18px rgba(0,191,255,0.85),
                0 0 42px rgba(255,0,0,0.45);

            animation:
                logoPulse 1.4s infinite ease-in-out;
        }

        /* ELECTRIC SIZZLE RING */

        .logo-wrapper::before{

            content:"";

            position:absolute;

            width:215px;
            height:215px;

            border-radius:50%;

            border-top:3px solid rgba(255,0,0,0.95);
            border-right:3px solid rgba(0,191,255,0.9);
            border-bottom:3px solid rgba(168,85,247,0.9);
            border-left:3px solid rgba(255,0,0,0.95);

            filter:blur(0.4px);

            box-shadow:
                0 0 12px rgba(255,0,0,0.85),
                0 0 28px rgba(0,191,255,0.55),
                0 0 40px rgba(168,85,247,0.4);

            animation:
                electricSpin 1.3s linear infinite,
                electricFlicker 0.12s infinite;
        }

        /* SECOND OUTER RING */

        .logo-wrapper::after{

            content:"";

            position:absolute;

            width:235px;
            height:235px;

            border-radius:50%;

            border-left:2px solid rgba(255,0,0,0.8);
            border-top:2px solid rgba(168,85,247,0.8);

            opacity:0.85;

            animation:
                reverseSpin 2s linear infinite,
                electricFlicker 0.2s infinite;
        }

        /* TITLE */

        h1{

            font-size:36px;

            margin-bottom:14px;

            letter-spacing:1px;

            text-shadow:
                0 0 12px rgba(255,0,0,0.45);
        }

        /* DESCRIPTION */

        .tagline{

            color:#e2e8f0;

            font-size:16px;

            line-height:1.9;

            margin-bottom:30px;
        }

        /* SPORTS SCORE DIVIDER */

        .score-divider{

            position:relative;

            display:flex;

            align-items:center;

            justify-content:center;

            gap:18px;

            margin:28px 0;

            width:100%;
        }

        .score-divider::before,
        .score-divider::after{

            content:"";

            flex:1;

            height:3px;

            border-radius:999px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255,0,0,0.9),
                    rgba(0,191,255,0.9),
                    transparent
                );

            box-shadow:
                0 0 12px rgba(255,0,0,0.45),
                0 0 18px rgba(0,191,255,0.35);
        }

        .score-box{

            min-width:120px;

            padding:10px 18px;

            border-radius:14px;

            background:
                linear-gradient(
                    135deg,
                    rgba(15,23,42,0.95),
                    rgba(30,41,59,0.92)
                );

            border:
                2px solid rgba(255,255,255,0.08);

            color:white;

            font-size:15px;

            font-weight:700;

            letter-spacing:1px;

            text-transform:uppercase;

            text-align:center;

            box-shadow:
                0 0 20px rgba(255,0,0,0.25),
                0 0 28px rgba(0,191,255,0.18);

            position:relative;

            overflow:hidden;
        }

        .score-box::before{

            content:"";

            position:absolute;

            top:0;
            left:-100%;

            width:100%;
            height:100%;

            background:
                linear-gradient(
                    120deg,
                    transparent,
                    rgba(255,255,255,0.22),
                    transparent
                );

            animation:scoreShine 3s infinite;
        }

        .score-box span{

            color:#ef4444;

            text-shadow:
                0 0 10px rgba(255,0,0,0.6);
        }

        @keyframes scoreShine{

            0%{
                left:-100%;
            }

            100%{
                left:120%;
            }
        }

        /* SOCIAL BUTTONS */

        .link-btn{

            display:flex;

            align-items:center;

            justify-content:center;

            gap:12px;

            width:100%;

            padding:16px;

            margin:14px 0;

            border-radius:14px;

            text-decoration:none;

            color:white;

            font-size:18px;

            font-weight:bold;

            transition:0.3s ease;

            position:relative;

            overflow:hidden;
        }

        .link-btn i{

            font-size:22px;
        }

        .twitter{

            background:
                linear-gradient(
                    135deg,
                    #1DA1F2,
                    #0ea5e9
                );
        }

        .discord{

            background:
                linear-gradient(
                    135deg,
                    #5865F2,
                    #7289da
                );
        }

        .link-btn:hover{

            transform:scale(1.04);

            opacity:0.96;

            box-shadow:
                0 0 22px rgba(255,0,0,0.55);
        }

        /* FOOTER IMAGE */

        .second-footer-logo{

            width:100%;

            max-width:260px;

            margin:28px auto 0 auto;

            display:block;

            object-fit:contain;

            opacity:0.95;
        }

        /* FOOTER */

        .footer{

            margin-top:24px;

            font-size:13px;

            color:#cbd5e1;
        }

        /* ANIMATIONS */

        @keyframes electricSpin{

            from{
                transform:rotate(0deg);
            }

            to{
                transform:rotate(360deg);
            }
        }

        @keyframes reverseSpin{

            from{
                transform:rotate(360deg);
            }

            to{
                transform:rotate(0deg);
            }
        }

        @keyframes electricFlicker{

            0%{
                opacity:1;
            }

            20%{
                opacity:0.3;
            }

            40%{
                opacity:1;
            }

            60%{
                opacity:0.45;
            }

            80%{
                opacity:1;
            }

            100%{
                opacity:0.7;
            }
        }

        @keyframes logoPulse{

            0%{
                transform:scale(1);
            }

            50%{
                transform:scale(1.03);
            }

            100%{
                transform:scale(1);
            }
        }

    </style>

</head>

<body>

    <div class="container">

        <!-- LOGO -->

        <div class="logo-wrapper">

            <img
                src="./logo.jpg"
                alt="Carolina Crosshairs Logo"
                class="profile-pic"
            >

        </div>

        <!-- TITLE -->

        <h1>Carolina Crosshairs</h1>

        <!-- DESCRIPTION -->

        <p class="tagline">

            Daily Posts on X<br>

            Discussion & Bet Props in Discord<br><br>

            Carolina Panthers • Charlotte Hornets<br>

            Carolina Hurricanes • NASCAR

        </p>

        <!-- SPORTS DIVIDER -->

        <div class="score-divider">

            <div class="score-box">

                LIVE • <span>CCH</span>

            </div>

        </div>

        <!-- X BUTTON -->

        <a
            href="https://x.com/nccrosshairs?s=21&t=eKC4xWjZ_6Gho3PfQ4EITw"
            class="link-btn twitter"
            target="_blank"
        >

            <i class="fa-brands fa-x-twitter"></i>

            Follow on X

        </a>

        <!-- DISCORD BUTTON -->

        <a
            href="https://discord.gg/RkWfmrhzq"
            class="link-btn discord"
            target="_blank"
        >

            <i class="fa-brands fa-discord"></i>

            Join The Discord

        </a>

        <!-- FOOTER IMAGE -->

        <img
            src="./America250_logo.svg.png"
            alt="America 250 Logo"
            class="second-footer-logo"
        >

        <!-- FOOTER -->

        <div class="footer">
            © 2026 Carolina Crosshairs
        </div>

    </div>

</body>
</html>
